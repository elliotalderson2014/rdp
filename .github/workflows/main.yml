name: SilkByte Self Hosted RDP Setup

on:
  workflow_dispatch:

jobs:
  setup:

    runs-on: self-hosted
    timeout-minutes: 60

    steps:

    # -----------------------------
    # Enable RDP
    # -----------------------------
    - name: Enable RDP
      shell: powershell
      run: |

        Set-ItemProperty `
        -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
        -Name "fDenyTSConnections" `
        -Value 0 `
        -Force


        Enable-NetFirewallRule `
        -DisplayGroup "Remote Desktop"


        Restart-Service TermService -Force



    # -----------------------------
    # Create Users
    # -----------------------------
    - name: Create Matin And Amirreza Users
      shell: powershell
      run: |

        $users = @(
            @{
                Username="${{ secrets.MATIN_USER }}"
                Password="${{ secrets.MATIN_PASS }}"
            },
            @{
                Username="${{ secrets.AMIRREZA_USER }}"
                Password="${{ secrets.AMIRREZA_PASS }}"
            }
        )


        foreach ($user in $users) {


            if(Get-LocalUser -Name $user.Username -ErrorAction SilentlyContinue){

                Write-Host "User already exists: $($user.Username)"

            }

            else {


                $securePassword = ConvertTo-SecureString `
                $user.Password `
                -AsPlainText `
                -Force


                New-LocalUser `
                -Name $user.Username `
                -Password $securePassword `
                -AccountNeverExpires


                Add-LocalGroupMember `
                -Group "Administrators" `
                -Member $user.Username


                Add-LocalGroupMember `
                -Group "Remote Desktop Users" `
                -Member $user.Username


                Write-Host "Created: $($user.Username)"

            }

        }



    # -----------------------------
    # Install Tailscale
    # -----------------------------
    - name: Install Tailscale
      shell: powershell
      run: |


        $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"


        Invoke-WebRequest `
        -Uri $url `
        -OutFile "$env:TEMP\tailscale.msi"



        Start-Process `
        msiexec.exe `
        -ArgumentList "/i $env:TEMP\tailscale.msi /quiet /norestart" `
        -Wait



    # -----------------------------
    # Connect Tailscale
    # -----------------------------
    - name: Connect Tailscale
      shell: powershell
      run: |


        & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
        --authkey=${{ secrets.TAILSCALE_AUTH_KEY }}



        $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4



        echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV



        Write-Host "================================"
        Write-Host "Tailscale IP: $ip"
        Write-Host "================================"



    # -----------------------------
    # Download Wallpapers
    # -----------------------------
    - name: Download Wallpapers
      shell: powershell
      run: |


        Invoke-WebRequest `
        -Uri "${{ secrets.MATIN_WALLPAPER }}" `
        -OutFile "C:\Users\Public\Desktop\Matin_Wallpaper.png"



        Invoke-WebRequest `
        -Uri "${{ secrets.AMIRREZA_WALLPAPER }}" `
        -OutFile "C:\Users\Public\Desktop\Amirreza_Wallpaper.png"



    # -----------------------------
    # Finish
    # -----------------------------
    - name: Complete
      shell: powershell
      run: |

        Write-Host "============================="
        Write-Host " RDP Setup Completed "
        Write-Host "============================="
