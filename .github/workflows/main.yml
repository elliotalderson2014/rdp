name: SilkByte VPS Setup & Backup

on:
  workflow_dispatch:

jobs:
  setup-and-backup:

    runs-on: windows-latest
    timeout-minutes: 120

    steps:

    # -----------------------------
    # Detect Temp Drive
    # -----------------------------
    - name: Detect Temp Drive
      shell: powershell
      run: |

        $drives = Get-PSDrive -PSProvider FileSystem

        foreach ($drive in $drives) {

          if ($drive.Name -ne "C") {

            echo "TEMP_DRIVE=$($drive.Name):" >> $env:GITHUB_ENV

            Write-Host "Temp Drive Found: $($drive.Name):"

            break
          }
        }


    # -----------------------------
    # Create folders
    # -----------------------------
    - name: Create folders
      shell: powershell
      run: |

        New-Item `
        -ItemType Directory `
        -Force `
        "$env:TEMP_DRIVE\Karing"


        New-Item `
        -ItemType Directory `
        -Force `
        "$env:TEMP_DRIVE\Backup"



    # -----------------------------
    # Create Users
    # -----------------------------
    - name: Create Users
      shell: powershell
      run: |

        $users = @(
          @{
            Name="${{ secrets.MATIN_USER }}"
            Pass="${{ secrets.MATIN_PASS }}"
          },
          @{
            Name="${{ secrets.AMIRREZA_USER }}"
            Pass="${{ secrets.AMIRREZA_PASS }}"
          }
        )


        foreach($user in $users){

          if(!(Get-LocalUser -Name $user.Name -ErrorAction SilentlyContinue)){


            $password = ConvertTo-SecureString `
            $user.Pass `
            -AsPlainText `
            -Force


            New-LocalUser `
            -Name $user.Name `
            -Password $password `
            -AccountNeverExpires


            Write-Host "Created user: $($user.Name)"

          }
          else {

            Write-Host "User exists: $($user.Name)"

          }

        }



    # -----------------------------
    # Download Karing
    # -----------------------------
    - name: Download Karing
      shell: powershell
      run: |

        Invoke-WebRequest `
        -Uri "${{ secrets.KARING_URL }}" `
        -OutFile "$env:TEMP_DRIVE\Karing\Karing.exe"



    # -----------------------------
    # Download Wallpapers
    # -----------------------------
    - name: Download Wallpapers
      shell: powershell
      run: |

        Invoke-WebRequest `
        -Uri "${{ secrets.MATIN_WALLPAPER }}" `
        -OutFile "$env:TEMP_DRIVE\Matin_Wallpaper.png"


        Invoke-WebRequest `
        -Uri "${{ secrets.AMIRREZA_WALLPAPER }}" `
        -OutFile "$env:TEMP_DRIVE\Amirreza_Wallpaper.png"



    # -----------------------------
    # Create Backup
    # -----------------------------
    - name: Create Backup
      shell: powershell
      run: |

        $backup="$env:TEMP_DRIVE\Backup"


        Copy-Item `
        "$env:TEMP_DRIVE\Karing" `
        "$backup\Karing" `
        -Recurse `
        -Force


        Copy-Item `
        "$env:TEMP_DRIVE\Matin_Wallpaper.png" `
        "$backup\Matin_Wallpaper.png" `
        -Force


        Copy-Item `
        "$env:TEMP_DRIVE\Amirreza_Wallpaper.png" `
        "$backup\Amirreza_Wallpaper.png" `
        -Force



    # -----------------------------
    # Install rclone
    # -----------------------------
    - name: Install rclone
      shell: powershell
      run: |

        $url = "https://downloads.rclone.org/rclone-current-windows-amd64.zip"


        Invoke-WebRequest `
        -Uri $url `
        -OutFile "$env:TEMP\rclone.zip"


        Expand-Archive `
        "$env:TEMP\rclone.zip" `
        -DestinationPath "$env:TEMP\rclone" `
        -Force


        $exe = Get-ChildItem `
        "$env:TEMP\rclone" `
        -Filter rclone.exe `
        -Recurse |
        Select-Object -First 1


        Copy-Item `
        $exe.FullName `
        "C:\Windows\System32\rclone.exe" `
        -Force


        rclone version



    # -----------------------------
    # Setup rclone config
    # -----------------------------
    - name: Setup rclone
      shell: powershell
      run: |

        New-Item `
        -ItemType Directory `
        -Force `
        "$env:USERPROFILE\.config\rclone"


        Set-Content `
        "$env:USERPROFILE\.config\rclone\rclone.conf" `
        '${{ secrets.RCLONE_CONFIG }}'



    # -----------------------------
    # Upload Google Drive
    # -----------------------------
    - name: Upload Google Drive
      shell: powershell
      run: |

        rclone copy `
        "$env:TEMP_DRIVE\Backup" `
        gdrive:SilkByte/Backup `
        --progress



    # -----------------------------
    # Complete
    # -----------------------------
    - name: Complete
      shell: powershell
      run: |

        Write-Host "=============================="
        Write-Host " SilkByte Backup Completed "
        Write-Host "=============================="
