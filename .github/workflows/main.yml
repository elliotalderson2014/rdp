name: SilkByte Remote Setup Backup

on:
  workflow_dispatch:

jobs:
  setup:

    runs-on: windows-latest
    timeout-minutes: 400

    steps:

    # -----------------------------
    # Enable RDP
    # -----------------------------
    - name: Enable RDP
      shell: powershell
      run: |
        Set-ItemProperty `
        -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
        -Name "fDenyTSConnections" `
        -Value 0 `
        -Force

        Enable-NetFirewallRule `
        -DisplayGroup "Remote Desktop"

    # -----------------------------
    # Create Users
    # -----------------------------
    - name: Create Users
      shell: powershell
      run: |
        $users = @(
          @{
            Name="${{ secrets.MATIN_USER }}"
            Pass="${{ secrets.MATIN_PASS }}"
          },
          @{
            Name="${{ secrets.AMIRREZA_USER }}"
            Pass="${{ secrets.AMIRREZA_PASS }}"
          }
        )

        foreach($u in $users){
          if(!(Get-LocalUser -Name $u.Name -ErrorAction SilentlyContinue)){
            $pass = ConvertTo-SecureString `
            $u.Pass `
            -AsPlainText `
            -Force

            New-LocalUser `
            -Name $u.Name `
            -Password $pass `
            -AccountNeverExpires

            Add-LocalGroupMember `
            -Group Administrators `
            -Member $u.Name

            Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $u.Name
          }
        }

    # -----------------------------
    # Install Tailscale (Latest)
    # -----------------------------
    - name: Install Tailscale
      shell: powershell
      run: |
        Invoke-WebRequest `
        -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
        -OutFile "$env:TEMP\tailscale.msi"

        Start-Process `
        msiexec.exe `
        -ArgumentList "/i $env:TEMP\tailscale.msi /quiet /norestart" `
        -Wait

    # -----------------------------
    # Connect Tailscale & Send Login Link
    # -----------------------------
    - name: Connect Tailscale
      shell: powershell
      run: |
        $tailscalePath = "$env:ProgramFiles\Tailscale\tailscale.exe"
        
        Start-Process -FilePath $tailscalePath -ArgumentList "up" -NoNewWindow -PassThru -RedirectStandardOutput "$env:TEMP\ts_out.txt" -RedirectStandardError "$env:TEMP\ts_err.txt"
        
        Start-Sleep -Seconds 5
        $output = Get-Content "$env:TEMP\ts_err.txt" -ErrorAction SilentlyContinue
        $loginUrl = ($output | Select-String -Pattern "https://login.tailscale.com\S+").Matches.Value

        if ($loginUrl) {
            $msg = "🔑 *Tailscale Login Required*`n`nPlease open this link to authenticate:`n$loginUrl"
            Invoke-RestMethod -Uri "https://api.telegram.org/bot${{ secrets.TOKEN }}/sendMessage" -Method Post -Body @{
                chat_id = "${{ secrets.ID }}"
                text = $msg
                parse_mode = "Markdown"
            } | Out-Null
        }

        Write-Host "Waiting for Tailscale authentication..."
        while ($true) {
            $ip = (& $tailscalePath ip -4 2>$null).Trim()
            if ($ip -and $ip -notmatch "is down") {
                break
            }
            Start-Sleep -Seconds 5
        }

        $cleanIp = $ip -replace 'https?://', ''

        $message = "🚀 *SilkByte Runner Online*`n`nTailscale IP:`n```$cleanIp```n`nTime: $(Get-Date)"

        Invoke-RestMethod `
        -Uri "https://api.telegram.org/bot${{ secrets.TOKEN }}/sendMessage" `
        -Method Post `
        -Body @{
            chat_id = "${{ secrets.ID }}"
            text = $message
            parse_mode = "MarkdownV2"
        } | Out-Null

        echo "Tailscale connected successfully"

    # -----------------------------
    # Create folders
    # -----------------------------
    - name: Create folders
      shell: powershell
      run: |
        New-Item `
        -ItemType Directory `
        -Force `
        "$env:TEMP\Karing"

    # -----------------------------
    # Download & Set Wallpapers
    # -----------------------------
    - name: Download & Set Wallpapers
      shell: powershell
      run: |
        $matinUser = "${{ secrets.MATIN_USER }}"
        $amirrezaUser = "${{ secrets.AMIRREZA_USER }}"

        $matinPath = "C:\Users\$matinUser\Matin_Wallpaper.png"
        $amirrezaPath = "C:\Users\$amirrezaUser\Amirreza_Wallpaper.png"

        New-Item -ItemType Directory -Force "C:\Users\$matinUser" | Out-Null
        New-Item -ItemType Directory -Force "C:\Users\$amirrezaUser" | Out-Null

        Invoke-WebRequest -Uri "${{ secrets.MATIN_WALLPAPER }}" -OutFile $matinPath
        Invoke-WebRequest -Uri "${{ secrets.AMIRREZA_WALLPAPER }}" -OutFile $amirrezaPath

        $usersToSet = @(
            @{ Name = $matinUser; Path = $matinPath },
            @{ Name = $amirrezaUser; Path = $amirrezaPath }
        )

        foreach ($u in $usersToSet) {
            $userSid = (Get-LocalUser -Name $u.Name).SID.Value
            
            if (-not (Test-Path "HKU:\$userSid")) {
                reg load "HKU\$userSid" "C:\Users\$($u.Name)\NTUSER.DAT" | Out-Null
            }

            $regDesktop = "Registry::HKU\$userSid\Control Panel\Desktop"
            if (Test-Path $regDesktop) {
                Set-ItemProperty -Path $regDesktop -Name Wallpaper -Value $u.Path
                Set-ItemProperty -Path $regDesktop -Name WallpaperStyle -Value "10"
                Set-ItemProperty -Path $regDesktop -Name TileWallpaper -Value "0"
            }
        }

    # -----------------------------
    # Keep Alive
    # -----------------------------
    - name: Keep Alive
      shell: powershell
      run: |
        while($true){
          Write-Host "$(Get-Date) Running..."
          Start-Sleep -Seconds 300
        }
