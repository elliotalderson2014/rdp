name: SilkByte Remote Setup Backup

on:
  workflow_dispatch:

jobs:
  setup:

    runs-on: windows-latest
    timeout-minutes: 400

    steps:

    # -----------------------------
    # Enable RDP
    # -----------------------------
    - name: Enable RDP
      shell: powershell
      run: |

        Set-ItemProperty `
        -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
        -Name "fDenyTSConnections" `
        -Value 0 `
        -Force


        Enable-NetFirewallRule `
        -DisplayGroup "Remote Desktop"



    # -----------------------------
    # Create Users
    # -----------------------------
    - name: Create Users
      shell: powershell
      run: |

        $users = @(
          @{
            Name="${{ secrets.MATIN_USER }}"
            Pass="${{ secrets.MATIN_PASS }}"
          },
          @{
            Name="${{ secrets.AMIRREZA_USER }}"
            Pass="${{ secrets.AMIRREZA_PASS }}"
          }
        )


        foreach($u in $users){

          if(!(Get-LocalUser -Name $u.Name -ErrorAction SilentlyContinue)){

            $pass = ConvertTo-SecureString `
            $u.Pass `
            -AsPlainText `
            -Force


            New-LocalUser `
            -Name $u.Name `
            -Password $pass `
            -AccountNeverExpires


            Add-LocalGroupMember `
            -Group Administrators `
            -Member $u.Name


            Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $u.Name


          }

        }



    # -----------------------------
    # Install Tailscale
    # -----------------------------
    - name: Install Tailscale
      shell: powershell
      run: |

        Invoke-WebRequest `
        -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
        -OutFile "$env:TEMP\tailscale.msi"


        Start-Process `
        msiexec.exe `
        -ArgumentList "/i $env:TEMP\tailscale.msi /quiet /norestart" `
        -Wait



    # -----------------------------
    # Connect Tailscale
    # -----------------------------
    - name: Connect Tailscale
      shell: powershell
      run: |

        & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
        --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}"


        $ip = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4).Trim()


        $message = "SilkByte Runner Online`n`nTailscale IP: $ip`n`nTime: $(Get-Date)"


        Invoke-RestMethod `
        -Uri "https://api.telegram.org/bot${{ secrets.TOKEN }}/sendMessage" `
        -Method Post `
        -Body @{
            chat_id = "${{ secrets.ID }}"
            text = $message
        } | Out-Null


        echo "Tailscale connected successfully"



    # -----------------------------
    # Create folders
    # -----------------------------
    - name: Create folders
      shell: powershell
      run: |

        New-Item `
        -ItemType Directory `
        -Force `
        "$env:TEMP_DRIVE\Karing"



    # -----------------------------
    # Wallpapers
    # -----------------------------
    - name: Download Wallpapers
      shell: powershell
      run: |

        Invoke-WebRequest `
        -Uri "${{ secrets.MATIN_WALLPAPER }}" `
        -OutFile "$env:TEMP_DRIVE\Matin_Wallpaper.png"


        Invoke-WebRequest `
        -Uri "${{ secrets.AMIRREZA_WALLPAPER }}" `
        -OutFile "$env:TEMP_DRIVE\Amirreza_Wallpaper.png"


    # -----------------------------
    # Keep Alive
    # -----------------------------
    - name: Keep Alive
      shell: powershell
      run: |

        while($true){

          Write-Host "$(Get-Date) Running..."

          Start-Sleep -Seconds 300

        }
