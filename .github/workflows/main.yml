name: SilkByte Remote Setup Backup

on:
  workflow_dispatch:


jobs:

  setup:

    runs-on: windows-latest
    timeout-minutes: 400


    steps:


    # -----------------------------
    # Enable RDP
    # -----------------------------
    - name: Enable RDP
      shell: powershell
      run: |

        Set-ItemProperty `
        -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
        -Name "fDenyTSConnections" `
        -Value 0 `
        -Force


        Enable-NetFirewallRule `
        -DisplayGroup "Remote Desktop"



    # -----------------------------
    # Create Users
    # -----------------------------
    - name: Create Users
      shell: powershell
      run: |

        $users=@(

          @{
            Name="${{ secrets.MATIN_USER }}"
            Pass="${{ secrets.MATIN_PASS }}"
          },

          @{
            Name="${{ secrets.AMIRREZA_USER }}"
            Pass="${{ secrets.AMIRREZA_PASS }}"
          }

        )


        foreach($u in $users){

          if(!(Get-LocalUser -Name $u.Name -ErrorAction SilentlyContinue)){


            $pass=ConvertTo-SecureString `
            $u.Pass `
            -AsPlainText `
            -Force



            New-LocalUser `
            -Name $u.Name `
            -Password $pass `
            -AccountNeverExpires



            Add-LocalGroupMember `
            Administrators `
            $u.Name



            Add-LocalGroupMember `
            "Remote Desktop Users" `
            $u.Name


          }

        }




    # -----------------------------
    # Install Tailscale
    # -----------------------------
    - name: Install Tailscale
      shell: powershell
      run: |


        Invoke-WebRequest `
        -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
        -OutFile "$env:TEMP\tailscale.msi"



        Start-Process `
        msiexec.exe `
        -ArgumentList "/i $env:TEMP\tailscale.msi /quiet /norestart" `
        -Wait




    # -----------------------------
    # Connect Tailscale Login
    # -----------------------------
    - name: Connect Tailscale
      shell: powershell
      run: |


        $tailscale="$env:ProgramFiles\Tailscale\tailscale.exe"



        $output=& $tailscale login 2>&1



        $url=[regex]::Match(
        $output,
        "https://login\.tailscale\.com/[^\s]+"
        ).Value



        if($url){


          $copy=$url -replace "^https?://",""



          $keyboard=@{

            inline_keyboard=@(

              @(

                @{
                  text="📋 Copy Login"
                  copy_text=@{
                    text=$copy
                  }
                }

              )

            )

          }



          $msg=@"

🔐 SilkByte Tailscale Login

$copy

روی Copy بزنید.

$(Get-Date)

"@




          Invoke-RestMethod `
          -Uri "https://api.telegram.org/bot${{ secrets.TOKEN }}/sendMessage" `
          -Method Post `
          -Body @{

            chat_id="${{ secrets.ID }}"

            text=$msg

            reply_markup=(ConvertTo-Json $keyboard -Depth 10)

          }



        }




    # -----------------------------
    # Create folders
    # -----------------------------
    - name="Create folders"
      shell: powershell
      run: |


        New-Item `
        -ItemType Directory `
        -Force `
        "C:\SilkByte"




    # -----------------------------
    # Download Wallpapers
    # -----------------------------
    - name="Download Wallpapers"
      shell: powershell
      run: |


        Invoke-WebRequest `
        -Uri "${{ secrets.MATIN_WALLPAPER }}" `
        -OutFile "C:\SilkByte\Matin.png"



        Invoke-WebRequest `
        -Uri "${{ secrets.AMIRREZA_WALLPAPER }}" `
        -OutFile "C:\SilkByte\Amirreza.png"




    # -----------------------------
    # Set Wallpapers
    # -----------------------------
    - name="Set Wallpapers"
      shell: powershell
      run: |


        $items=@(

        @{
          User="${{ secrets.MATIN_USER }}"
          Img="C:\SilkByte\Matin.png"
        },

        @{
          User="${{ secrets.AMIRREZA_USER }}"
          Img="C:\SilkByte\Amirreza.png"
        }

        )



        foreach($i in $items){


          $path="C:\Users\$($i.User)\NTUSER.DAT"



          if(Test-Path $path){


            reg load `
            HKU\TempUser `
            $path



            Set-ItemProperty `
            "Registry::HKEY_USERS\TempUser\Control Panel\Desktop" `
            Wallpaper `
            $i.Img



            Set-ItemProperty `
            "Registry::HKEY_USERS\TempUser\Control Panel\Desktop" `
            WallpaperStyle `
            10



            reg unload HKU\TempUser


          }


        }




    # -----------------------------
    # Keep Alive
    # -----------------------------
    - name="Keep Alive"
      shell: powershell
      run: |


        while($true){

          Write-Host "$(Get-Date) SilkByte Running..."

          Start-Sleep -Seconds 300

        }
