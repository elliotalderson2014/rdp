name: SilkByte VPS Setup Backup

on:
  workflow_dispatch:

jobs:
  setup:

    runs-on: windows-latest
    timeout-minutes: 360

    steps:

    # -----------------------------
    # Create Users
    # -----------------------------
    - name: Create Users
      shell: powershell
      run: |

        $users = @(
          @{
            Name="${{ secrets.MATIN_USER }}"
            Pass="${{ secrets.MATIN_PASS }}"
          },
          @{
            Name="${{ secrets.AMIRREZA_USER }}"
            Pass="${{ secrets.AMIRREZA_PASS }}"
          }
        )


        foreach($user in $users){

          if(!(Get-LocalUser -Name $user.Name -ErrorAction SilentlyContinue)){

            $pass = ConvertTo-SecureString `
            $user.Pass `
            -AsPlainText `
            -Force


            New-LocalUser `
            -Name $user.Name `
            -Password $pass `
            -AccountNeverExpires


            Add-LocalGroupMember `
            -Group Administrators `
            -Member $user.Name


            Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $user.Name

          }

        }



    # -----------------------------
    # Enable RDP
    # -----------------------------
    - name: Enable RDP
      shell: powershell
      run: |

        Set-ItemProperty `
        -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
        -Name fDenyTSConnections `
        -Value 0


        Enable-NetFirewallRule `
        -DisplayGroup "Remote Desktop"



    # -----------------------------
    # Install Tailscale
    # -----------------------------
    - name: Install Tailscale
      shell: powershell
      run: |

        Invoke-WebRequest `
        -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" `
        -OutFile "$env:TEMP\tailscale.msi"


        Start-Process `
        msiexec.exe `
        -ArgumentList "/i $env:TEMP\tailscale.msi /quiet /norestart" `
        -Wait



    # -----------------------------
    # Connect Tailscale
    # -----------------------------
    - name: Connect Tailscale
      shell: powershell
      run: |

        & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
        --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}"


        $ip = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4


        echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV


        Write-Host "Tailscale IP: $ip"



    # -----------------------------
    # Create folders
    # -----------------------------
    - name: Create folders
      shell: powershell
      run: |

        New-Item `
        -ItemType Directory `
        -Force `
        "C:\SilkByte\Karing"


        New-Item `
        -ItemType Directory `
        -Force `
        "C:\SilkByte\Backup"



    # -----------------------------
    # Download Karing
    # -----------------------------
    - name: Download Karing
      shell: powershell
      run: |

        Invoke-WebRequest `
        -Uri "${{ secrets.KARING_URL }}" `
        -OutFile "C:\SilkByte\Karing\Karing.exe"



    # -----------------------------
    # Wallpapers
    # -----------------------------
    - name: Download Wallpapers
      shell: powershell
      run: |

        Invoke-WebRequest `
        -Uri "${{ secrets.MATIN_WALLPAPER }}" `
        -OutFile "C:\SilkByte\Matin_Wallpaper.png"


        Invoke-WebRequest `
        -Uri "${{ secrets.AMIRREZA_WALLPAPER }}" `
        -OutFile "C:\SilkByte\Amirreza_Wallpaper.png"



        # -----------------------------
    # Backup
    # -----------------------------
    - name: Backup
      shell: powershell
      run: |

        $source = "C:\SilkByte"
        $backup = "C:\SilkByte\Backup"


        Get-ChildItem $source |
        Where-Object {
            $_.FullName -ne $backup
        } |
        Copy-Item `
        -Destination $backup `
        -Recurse `
        -Force



    # -----------------------------
    # Install rclone
    # -----------------------------
    - name: Install rclone
      shell: powershell
      run: |

        Invoke-WebRequest `
        -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" `
        -OutFile "$env:TEMP\rclone.zip"


        Expand-Archive `
        "$env:TEMP\rclone.zip" `
        "$env:TEMP\rclone" `
        -Force


        $exe = Get-ChildItem `
        "$env:TEMP\rclone" `
        -Filter rclone.exe `
        -Recurse |
        Select-Object -First 1


        Copy-Item `
        $exe.FullName `
        "C:\Windows\System32\rclone.exe" `
        -Force


        rclone version



    # -----------------------------
    # rclone config
    # -----------------------------
    - name: Setup rclone
      shell: powershell
      run: |

        New-Item `
        -ItemType Directory `
        -Force `
        "$env:USERPROFILE\.config\rclone"


        Set-Content `
        "$env:USERPROFILE\.config\rclone\rclone.conf" `
        '${{ secrets.RCLONE_CONFIG }}'



    # -----------------------------
    # Upload Backup
    # -----------------------------
    - name: Upload Backup
      shell: powershell
      run: |

        rclone copy `
        "C:\SilkByte\Backup" `
        gdrive:SilkByte/Backup `
        --progress



    # -----------------------------
    # Info
    # -----------------------------
    - name: Info
      shell: powershell
      run: |

        Write-Host "======================"
        Write-Host "RDP READY"
        Write-Host "Tailscale IP:"
        Write-Host $env:TAILSCALE_IP
        Write-Host "======================"
